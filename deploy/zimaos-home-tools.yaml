# ZimaOS app 1 of 3: paste into App Store → Custom Install → Import.
# (ZimaOS keeps only one service per imported app, so Caddy is its own
# app: zimaos-caddy.yaml.) Port 8080 is published so Caddy can reach it
# through the host; it is plain HTTP, LAN only.
name: home-tools
services:
  home-tools:
    image: ghcr.io/xanderongithub/home-tools:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 256M
    # Games: talk to Docker through the socket proxy (zimaos-docker-proxy.yaml).
    command: ["-docker", "/run/docker-proxy/docker.sock"]
    environment:
      # Discord bot (decision #42): paste the token in the ZimaOS form,
      # never into this file. Empty = the bot stays offline.
      DISCORD_TOKEN: ""
      # Local time zone: the bot's daily persona and poll times follow it
      # (unset = UTC, so "midnight" would be 8 pm in New York).
      TZ: America/New_York
    volumes:
      - type: bind
        source: /var/lib/casaos_data/.media/Vault/Apps/HomeTools
        target: /data
      - type: bind
        source: /run/home-tools-docker
        target: /run/docker-proxy
      # Valheim's whitelist (optional, deploy/README.md → Discord bot):
      # the folder with its permittedlist.txt, read-write.
      # - type: bind
      #   source: <the Valheim app's folder with permittedlist.txt>
      #   target: /valheim

x-casaos:
  title:
    custom: Home Tools
  icon: https://raw.githubusercontent.com/XanderOnGithub/home-tools/main/web/apps/fitness/public/apple-touch-icon.png
  main: home-tools
  index: /
